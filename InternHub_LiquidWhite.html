<html lang="en"><head><meta charset="utf-8">

<title>InternHub – Liquid White Portal</title><meta name="theme-color" content="#f4faf6"><meta name="color-scheme" content="light">

<style>
:root{--ink:#04140d;--deep:#0a2418;--cy:#10b981;--gold:#fbbf24;--rose:#ff6b5e;--mint:#6ee7b7;--foam:#effaf1;--mut:#9bbba6;--gl:rgba(239,250,241,.07);--ln:rgba(239,250,241,.15);--d:'Unbounded','Trebuchet MS',sans-serif;--b:'Figtree',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1100px 700px at 85% -10%,#0f4a2c,transparent 70%),radial-gradient(900px 600px at -10% 110%,#2a3a0c,transparent 70%),var(--ink);color:var(--foam);font:16px/1.55 var(--b);overflow-x:hidden}
h1,h2,h3{font-family:var(--d);margin:0;line-height:1.15}h2{font-size:1.5rem;margin-bottom:14px}h3{font-size:1rem;margin:18px 0 8px}
#goo{position:fixed;inset:0;z-index:0;filter:url(#g);pointer-events:none}.bl{position:absolute;border-radius:50%;animation:dr 20s ease-in-out infinite alternate}
.bl:nth-child(1){width:44vmax;height:44vmax;left:-12vmax;top:-12vmax;background:var(--cy);opacity:.28}.bl:nth-child(2){width:34vmax;height:34vmax;right:-8vmax;top:35vh;background:var(--gold);opacity:.16;animation-duration:26s}.bl:nth-child(3){width:30vmax;height:30vmax;left:25vw;bottom:-14vmax;background:var(--rose);opacity:.2;animation-duration:30s}
@keyframes dr{to{transform:translate(8vw,9vh) scale(1.2)}}
.rp{position:fixed;z-index:70;width:20px;height:20px;margin:-10px;border-radius:50%;border:1px solid var(--cy);pointer-events:none;opacity:.7;animation:rp .9s ease-out forwards}@keyframes rp{to{transform:scale(6);opacity:0}}
#app{position:relative;z-index:2;min-height:100vh}
.glass{background:rgba(8,30,20,.62);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:28px}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;place-items:center;text-align:center;padding:16px;transition:clip-path 1.4s cubic-bezier(.7,0,.2,1),opacity .6s 1s;clip-path:circle(150% at 50% 50%)}#intro.out{clip-path:circle(0% at 50% 50%);opacity:0;pointer-events:none}
#ib{position:absolute;inset:0;filter:url(#g)}#ib i{position:absolute;left:50%;top:50%;border-radius:50%;width:10vmax;height:10vmax;margin:-5vmax;transform:scale(0);transition:transform 2.4s cubic-bezier(.2,.8,.2,1)}#intro.go #ib i{transform:var(--t)}
#ib i:nth-child(1){background:var(--cy);--t:translate(-14vmax,-6vmax) scale(2.6)}#ib i:nth-child(2){background:var(--gold);--t:translate(15vmax,4vmax) scale(2);transition-delay:.15s}#ib i:nth-child(3){background:var(--rose);--t:translate(-3vmax,12vmax) scale(1.8);transition-delay:.3s}#ib i:nth-child(4){background:#bef264;--t:scale(2.4);transition-delay:.05s}
#it{position:relative;font:900 clamp(2.3rem,11vw,8rem)/1 var(--d);letter-spacing:-.03em}#it span{display:inline-block;opacity:0;filter:blur(8px);transform:translateX(var(--dx)) rotate(var(--rt))}
#intro.hit #it span{animation:lt 1s cubic-bezier(.2,1.3,.3,1) forwards;animation-delay:calc(var(--i)*260ms)}@keyframes lt{to{opacity:1;filter:blur(0);transform:none}}
#iw{position:relative;margin-top:22px;font:500 clamp(1rem,3.5vw,1.6rem) var(--b);min-height:2em}#iw span{display:inline-block;margin:0 .25em;opacity:0;filter:blur(10px);transform:translateY(14px);transition:.6s}#iw span.on{opacity:1;filter:none;transform:none}
#tap{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:18px;background:var(--ink);border:0;color:var(--foam);font:500 1rem var(--b);cursor:pointer;z-index:3;transition:opacity .5s}#tap b{font:700 1.4rem var(--d)}
#tap span{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff8,var(--cy) 45%,var(--gold));animation:pu 2.2s ease-in-out infinite;font-size:1.6rem;color:var(--ink)}@keyframes pu{50%{transform:scale(1.14);border-radius:42% 58% 55% 45%}}
#intro.go #tap{opacity:0;pointer-events:none}#skip{position:absolute;right:18px;bottom:18px;z-index:4;background:none;border:1px solid var(--ln);color:var(--mut);border-radius:99px;padding:8px 16px;font:inherit;font-size:.85rem;cursor:pointer;display:none}#intro.go #skip{display:block}
/* login */
.lg{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 30px;overflow:hidden}.lc{position:relative;z-index:2;width:min(460px,100%);padding:32px;margin-top:70px;transition:opacity .9s,filter .9s,transform .9s}.lg:not(.on) .lc{opacity:.1;filter:blur(4px);transform:translateY(24px) scale(.95);pointer-events:none}
.lamp{position:relative;width:260px;height:190px;flex:none}.shade{position:absolute;left:50%;top:0;width:150px;height:58px;margin-left:-75px;background:linear-gradient(#14452a,#0a2418);border-radius:80px 80px 10px 10px;border:1px solid var(--ln);z-index:3}.bulb{position:absolute;left:50%;top:56px;width:50px;height:20px;margin-left:-25px;border-radius:0 0 50px 50px;background:#14452a;transition:.7s;z-index:2}.lg.on .bulb{background:#fff6d6;box-shadow:0 0 30px 12px rgba(251,191,36,.9),0 0 100px 50px rgba(16,185,129,.5)}
.beam{position:absolute;left:50%;top:66px;width:min(760px,150vw);height:78vh;transform:translateX(-50%) scaleX(.15);transform-origin:top;opacity:0;background:linear-gradient(180deg,rgba(251,191,36,.55),rgba(16,185,129,.18) 50%,transparent 88%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(5px);transition:opacity .9s,transform 1.1s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:1}.lg.on .beam{opacity:1;transform:translateX(-50%) scaleX(1)}
.cord{position:absolute;left:calc(50% + 58px);top:44px;width:28px;height:130px;border:0;background:none;cursor:pointer;padding:0;z-index:2}.cord:before{content:"";position:absolute;left:13px;top:0;bottom:14px;width:2px;background:var(--gold)}.cord i{position:absolute;left:4px;bottom:0;width:20px;height:20px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}.cord.pull{animation:pl .55s}@keyframes pl{35%{transform:translateY(30px)}}
.hint{position:absolute;top:200px;left:0;right:0;text-align:center;color:var(--gold);font-weight:700;z-index:3;animation:bk 1.8s ease-in-out infinite}.lg.on .hint{display:none}@keyframes bk{50%{opacity:.35}}.lc h1{font-size:2rem;background:linear-gradient(100deg,var(--cy),var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.lc p{color:var(--mut);margin:6px 0 18px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
input,select,textarea{width:100%;padding:12px 16px;margin:4px 0 12px;border-radius:18px;border:1px solid var(--ln);background:rgba(4,20,13,.6);color:var(--foam);font:inherit}label{font-size:.8rem;color:var(--mut);font-weight:700}
.b,.chip{border:0;border-radius:99px;padding:12px 24px;background:linear-gradient(120deg,var(--cy),var(--gold));color:var(--ink);font:700 .95rem var(--b);cursor:pointer;transition:border-radius .5s,transform .3s}.b:hover{border-radius:20px 40px 20px 40px;transform:translateY(-2px)}
.chip{background:var(--gl);color:var(--foam);border:1px solid var(--ln)}.chip.on{background:var(--gold);color:var(--ink);border-radius:14px 28px 14px 28px}.b.sm{padding:6px 14px;font-size:.82rem;margin:2px}.b.red{background:var(--rose);color:#fff}.b.am{background:var(--gold)}.b:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}#err{color:var(--rose);min-height:1.3em;font-size:.9rem}
/* portal */
.pt{display:grid;grid-template-columns:260px 1fr;gap:18px;padding:16px;max-width:1340px;margin:0 auto;transition:grid-template-columns .4s}.pt.col{grid-template-columns:84px 1fr}.side{align-self:start;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;border-radius:36px}
.sh{display:flex;align-items:center;gap:10px;padding:6px 6px 14px;border-bottom:1px solid var(--ln);margin-bottom:6px}.av{flex:none;width:44px;height:44px;border-radius:50% 50% 50% 14px;display:grid;place-items:center;font:900 1.2rem var(--d);background:linear-gradient(135deg,var(--cy),var(--gold));color:#fff}.st{flex:1;min-width:0}.st b{display:block;font:700 .95rem var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st small{color:var(--mut)}.tg{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--gl);color:var(--foam);cursor:pointer}
.mi{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:6px;border-radius:22px;cursor:pointer;font:inherit;transition:.35s}.ic2{flex:none;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:var(--gl);transition:.4s}.mi:hover{color:var(--foam)}.mi:hover .ic2{border-radius:50%;transform:scale(1.08)}
.mi.on{color:var(--foam);font-weight:700;background:rgba(16,185,129,.16)}.mi.on .ic2{background:linear-gradient(135deg,var(--cy),var(--gold));box-shadow:0 0 18px rgba(16,185,129,.7)}.mi.on:before{content:"";position:absolute;left:-12px;top:20%;bottom:20%;width:5px;border-radius:0 6px 6px 0;background:var(--gold);box-shadow:0 0 12px var(--gold)}.lo{margin-top:auto}.lo:hover .ic2{background:var(--rose)}.col .sh{flex-direction:column}.col .st,.col .lb{display:none}.col .mi{justify-content:center}.col .mi em{position:absolute;top:0;right:4px;margin:0}
.mi em{margin-left:auto;background:var(--rose);color:#fff;border-radius:99px;padding:0 8px;font-size:.75rem;font-style:normal}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;margin-bottom:16px;border-radius:99px}.panel{padding:24px;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(20px);border-radius:80px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:10px}.tile{padding:18px;background:var(--gl);border:1px solid var(--ln);border-radius:30px 30px 30px 8px}.tile b{display:block;font:900 2rem var(--d);color:var(--cy)}.tile span{color:var(--mut);font-size:.9rem}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;margin-bottom:10px;border:1px solid var(--ln);border-radius:24px;background:var(--gl)}.item small{color:var(--mut)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);font-size:.92rem}th{color:var(--mut);font-size:.78rem}
.bd{padding:2px 12px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}.g{background:rgba(110,231,183,.16);color:var(--mint)}.a{background:rgba(255,200,97,.16);color:#ffc861}.r{background:rgba(255,107,94,.18);color:var(--rose)}
.how{border:1px dashed var(--cy);border-radius:20px;padding:10px 16px;color:var(--mut);font-size:.88rem;margin-top:18px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bar{height:14px;border-radius:9px;background:linear-gradient(90deg,var(--cy),var(--gold));transition:width 1s}
#md{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(4,20,13,.8);padding:16px}#md.on{display:grid}.mdb{width:min(560px,100%);max-height:90vh;overflow:auto;padding:26px;animation:pop .5s}@keyframes pop{from{transform:scale(.6);opacity:0;border-radius:90px}}
.cel{text-align:center;position:relative;overflow:hidden}.cel h2{font-size:1.9rem;background:linear-gradient(100deg,var(--gold),var(--rose),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}.cel .em{font-size:4rem;animation:pu 1.6s infinite}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:95;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--gold);color:var(--ink);font-weight:700;padding:12px 22px;border-radius:99px;z-index:96;transition:.5s;max-width:92vw}#toast.on{transform:translate(-50%,0)}
@media(max-width:820px){.pt{grid-template-columns:1fr!important;padding-bottom:96px}.side{position:fixed;left:8px;right:8px;bottom:8px;top:auto;z-index:40;max-height:none;flex-direction:row;padding:6px 8px;border-radius:99px;overflow-x:auto}.sh,.lb,.lo{display:none}.side nav{display:flex;gap:4px}.mi{width:auto;flex:none}.mi.on:before{left:25%;right:25%;top:auto;bottom:-3px;height:4px;width:auto;border-radius:6px 6px 0 0}.row2{grid-template-columns:1fr}#toast{bottom:90px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#bg3{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#ai{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 20px));z-index:80}body.ready #ai{display:block}body.ready #app{padding-top:64px}
#ait{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:99px;background:rgba(8,30,20,.82);backdrop-filter:blur(16px);border:1px solid var(--ln)}
#aif{flex:none;width:38px;height:38px;padding:0;border-radius:50% 50% 50% 12px;border:1px solid var(--ln);background:linear-gradient(135deg,#0f3d27,#06180f);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 16px rgba(16,185,129,.5)}#aif svg{width:24px;height:24px}
#aiq{flex:1;min-width:0;margin:0;padding:8px 16px;border-radius:99px}.mc{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--gl);color:var(--foam);cursor:pointer}.mc.rec{background:var(--rose);animation:pu 1s infinite}

.ah{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--ln)}.ah svg{width:30px;height:30px;flex:none}.ah b{font:700 .95rem var(--d)}.ah small{flex:1;color:var(--mut);font-size:.72rem;line-height:1.2}.ah button{background:var(--gl);border:1px solid var(--ln);color:var(--foam);border-radius:50%;width:30px;height:30px;cursor:pointer}

#aic{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 12px;max-height:110px;overflow:auto;border-top:1px solid var(--ln)}#aic button{border:1px solid var(--ln);background:var(--gl);color:var(--foam);border-radius:99px;padding:6px 12px;font:500 .8rem var(--b);cursor:pointer}#aic button:hover{background:var(--cy);color:var(--ink)}
@media(min-width:821px){.side{top:78px;max-height:calc(100vh - 94px)}}
@media(max-width:820px){#aip{height:min(520px,calc(100vh - 160px))}}
.tile,.item{transition:transform .25s ease,border-radius .4s}.tile{border-radius:34px 34px 34px 8px}
.bc{background:var(--rose);color:#fff;border-radius:99px;padding:0 6px;font-size:.7rem;font-style:normal;margin-left:4px}
.stp{display:flex;gap:6px;overflow-x:auto;margin:4px 0 18px;padding-bottom:4px}.stp span{flex:1;min-width:88px;text-align:center;padding:9px 6px;border-radius:99px;background:var(--gl);border:1px solid var(--ln);font-size:.78rem;color:var(--mut);white-space:nowrap}.stp .d{background:linear-gradient(120deg,var(--cy),var(--gold));color:var(--ink);font-weight:700;border-color:transparent}.stp .c{border-color:var(--gold);color:var(--gold);animation:gl 2s infinite}@keyframes gl{50%{box-shadow:0 0 0 6px rgba(251,191,36,.2)}}

#aivs{margin:6px 12px 0;width:calc(100% - 24px);font-size:.78rem;padding:6px 12px}
#cs{position:fixed;inset:0;z-index:90;background:rgba(4,20,13,.55);cursor:crosshair}#cs canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.csb{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 18px;border-radius:99px;background:rgba(8,30,20,.92);border:1px solid var(--ln);max-width:94vw;font-size:.9rem}.csb b{font-family:var(--d);color:var(--gold)}.csb span{color:var(--mut)}
